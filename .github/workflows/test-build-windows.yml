# Temporary: unsigned Windows test build for this branch only. Not for upstream.
name: Test build (Windows)

on:
  push:
    branches: [build/windows-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Setup pnpm
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # No updater artifacts: they need the release signing key, which a fork does not have.
      - name: Build MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          '{"bundle":{"createUpdaterArtifacts":false}}' | Out-File -FilePath no-updater.json -Encoding ascii
          pnpm tauri build --bundles msi -c no-updater.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: cc-switch-windows-x64-test
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/cc-switch.exe
          if-no-files-found: error
          retention-days: 7
